# ============================================
# USMON SHASHLIK — Render.com Blueprint
# ============================================

databases:
  - name: usmon-shashlik-db
    plan: free
    databaseName: usmonshashlik
    user: usmonshashlik

services:
  - type: web
    name: usmon-shashlik
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        value: 8832100007:AAHjZpn6CKLPgPHPnzUAnRsJR9rqRpTjz8g
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        fromDatabase:
          name: usmon-shashlik-db
          property: connectionString
